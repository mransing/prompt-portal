<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login — Prompt Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="brand-mark" style="width:48px;height:48px;margin:0 auto;border-radius:14px;font-size:22px;color:#fff;">P</div>
      <h1>Prompt Portal</h1>
      <p>Private, self-hosted version control for generative prompts and result images.</p>
      <div class="oauth">
        <button class="google">G &nbsp; Continue with Google</button>
        <button class="facebook">f &nbsp; Continue with Facebook</button>
      </div>
      <p class="note">Single-user access. Only allowlisted accounts can sign in.<br/>No public sharing.</p>
    </div>
  </div>
</body>
</html>
